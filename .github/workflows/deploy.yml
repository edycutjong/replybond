name: deploy

# Deploys only after the CI workflow succeeds: production for pushes to main,
# a preview for pull requests from this repository (never from forks).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_RJcQx4a22v5LqjetHv8HhhLY
  VERCEL_PROJECT_ID: prj_wUWXODVXiTlxhksFAvvglSXKcmTE

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.event == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the Vercel project settings
        run: vercel pull --yes --environment=${{ github.event.workflow_run.event == 'push' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_SECRET }}

      - name: Build
        run: vercel build ${{ github.event.workflow_run.event == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_SECRET }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event.workflow_run.event == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_SECRET }}
